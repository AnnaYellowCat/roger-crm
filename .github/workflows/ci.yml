name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Dependencies, Lint, Tests, Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: src/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 1. Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Environment for Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          # Используем SQLite в памяти для быстрых тестов в CI
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=:memory:/' .env

      - name: 2. Linter & Formatter (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: 3. Unit Tests
        run: php artisan test

      - name: 4. Build Docker Image
        run: |
          if [ -f "../Dockerfile" ]; then
            echo "Dockerfile найден. Начинаем сборку..."
            docker build -t roger-crm-app:test -f ../Dockerfile ..
          else
            echo "Dockerfile пока не создан. Пропускаем сборку."
          fi